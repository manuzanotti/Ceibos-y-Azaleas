<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceibos y Azaleas - Crear Cuenta</title>
    <link rel="stylesheet" href="../css/registro.css">
</head>
<body>
    <div class="register-container">
        <div class="register-card">
            <div class="brand-header">
                <h2>Ceibos y Azaleas</h2>
                <p>Complejo de Cabañas</p>
            </div>

            <h3>Crear una Cuenta</h3>

            <form id="registerForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Juan" required>
                    </div>

                    <div class="form-group">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" name="apellido" placeholder="Pérez" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="dni">DNI / Documento</label>
                    <input type="text" id="dni" name="dni" placeholder="12345678" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div id="error-message" class="error-message"></div>
                <div id="success-message" class="success-message"></div>

                <button type="submit" class="btn-submit">Registrarse</button>
            </form>

            <div class="register-footer">
                <p>¿Ya tenés una cuenta? <a href="login.html">Iniciá sesión acá</a></p>
            </div>
        </div>
    </div>

    <script src="../js/registro.js"></script>
</body>
</html>
