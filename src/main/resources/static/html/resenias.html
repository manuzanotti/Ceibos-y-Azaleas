<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reseñas Generales - Ceibos y Azaleas</title>
    <!-- Font Awesome para los íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/historial.css">
    <link rel="stylesheet" href="../css/resenias.css">
</head>
<body class="bg-nature">
    
    <!-- Header dinámico -->
    <div id="header-container"></div>

    <!-- Contenedor Principal Centrado (Mismo layout de Historial) -->
    <main class="historial-main-container">
        
        <!-- Título y Subtítulo Centrados -->
        <div class="historial-header-center">
            <h1 class="historial-title-main">Reseñas del Complejo</h1>
            <p class="historial-subtitle-main">Opiniones y experiencias compartidas por nuestros huéspedes</p>
        </div>

        <!-- Tabla Estilizada de Reseñas Generales -->
        <div class="historial-table-box">
            <table class="tabla-historial-estilizada">
                <thead>
                    <tr>
                        <th>Cabaña</th>
                        <th>Huésped</th>
                        <th>Estadía</th>
                        <th>Puntuación</th>
                        <th>Reseña / Comentario</th>
                    </tr>
                </thead>
                <tbody id="tablaResenasGeneralesBody">
                    <tr>
                        <td colspan="5" class="table-empty">Cargando reseñas del complejo...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

    <!-- Modal para ver el comentario completo al hacer clic en una fila -->
    <div class="modal-overlay" id="modalDetalleResenaGeneral">
        <div class="modal-content modal-detalles">
            <div class="modal-header">
                <h3>Detalle de la Reseña</h3>
                <button class="btn-close" id="btnCloseModalResenaGeneral">&times;</button>
            </div>

            <div class="modal-body-details">
                <div class="detail-row">
                    <span class="detail-label">Cabaña:</span>
                    <span id="rgModalCabania" class="detail-value">-</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Huésped:</span>
                    <span id="rgModalHuesped" class="detail-value">-</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Fecha de Estadía:</span>
                    <span id="rgModalEstadia" class="detail-value">-</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Puntuación:</span>
                    <span id="rgModalPuntuacion" class="detail-value">-</span>
                </div>
                <div class="detail-row total-row" style="flex-direction: column; align-items: flex-start; gap: 0.5rem;">
                    <span class="detail-label">Comentario completo:</span>
                    <p id="rgModalComentario" style="margin: 0; font-style: italic; color: #495057; line-height: 1.5; background: #f7f5f0; padding: 1rem; border-radius: 8px; width: 100%; box-sizing: border-box;">-</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/header.js"></script>
    <script src="../js/resenias.js"></script>
</body>
</html>
