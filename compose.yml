services:
  mysql:
    image: mysql:8.4
    container_name: ceibos_mysql
    environment:
      MYSQL_DATABASE: ceibos
      MYSQL_USER: adm
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: